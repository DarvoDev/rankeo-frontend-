server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA: /sala/ABC123 y cualquier otra ruta caen en index.html
    location / {
        try_files $uri /index.html;
    }

    # Vite pone hash en los nombres de /assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
